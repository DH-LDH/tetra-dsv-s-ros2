# LORD MicroStrain 3DM-GV7-AHRS — 실기 장착 IMU 설정.
#
# HANDOFF 초안에는 iAHRS 로 적혀 있었지만, 2026-08-13 젯슨에 USB 허브를 옮겨
# 붙이고 확인해 보니 실제 장착품은 MicroStrain 3DM-GV7-AHRS 였습니다.
#     /dev/ttyACM0  Lord_Microstrain / Lord_Inertial_Sensor
#     Model 3DMGV7-AHRS, S/N 6288.171025, FW 1.1.00
# 드라이버도 iAHRS 계열이 아니라 ros-humble-microstrain-inertial-driver 를 씁니다.
#
# 이 파일은 드라이버 기본 params.yml 위에 덮어쓰는 값만 담습니다:
#     ros2 launch microstrain_inertial_driver microstrain_launch.py \
#         params_file:=<이 파일>

microstrain_inertial_driver:
  ros__parameters:

    port: "/dev/ttyACM0"
    baudrate: 115200

    # GV7 은 AHRS 입니다 - GNSS 도 PPS 입력도 없습니다. 기본값 1(Receiver 1)로
    # 두면 드라이버가 부팅 중 PPS 소스 설정을 시도하다가 "Error(3): Invalid
    # Parameter" 로 죽습니다. 장치 결함이 아니라 없는 기능을 켜려던 것입니다.
    filter_pps_source: 0

    # 같은 이유로 자기편각(declination)도 끕니다. 기본값 2(자기 모델)는 위치를
    # 알아야 편각을 계산할 수 있어서 GNSS 가 있는 모델 전용입니다. 드라이버
    # params.yml 주석에도 "CV7 을 쓸 때는 1 이나 3 으로 바꿔야 노드가 시작된다"
    # 고 적혀 있고, GV7 도 같은 7-시리즈라 동일하게 걸립니다.
    #     1 = None / 2 = magnetic model / 3 = manual
    filter_declination_source: 1

    # URDF 의 imu_link 와 일치시켜야 EKF/TF 가 맞습니다 (드라이버 기본값과
    # 우연히 같지만, 바뀌면 조용히 어긋나므로 여기 명시해 둡니다).
    frame_id: "imu_link"

    # ROS 관례(ENU). 시뮬 쪽 EKF 설정과 같은 규약을 씁니다.
    use_enu_frame: True

    # 자이로 공분산을 기본값 0.01 에서 1.0 으로 올립니다 (2026-08-14).
    #
    # 이 장치는 공분산을 스스로 내지 않습니다. 드라이버 params.yml 354행이
    # "Static IMU message covariance values (the device does not generate
    # these)" 라고 적고 있고, 0.01 은 근거 없는 기본 상수입니다. 그런데 휠
    # 오도메트리는 0.05 를 실어 보내므로, EKF 가 IMU 를 휠보다 5배 신뢰하게
    # 되어 있었습니다. 근거가 있어서가 아니라 양쪽 기본값이 그랬을 뿐입니다.
    #
    # 문제는 이 자이로에 상수 편향이 있다는 것입니다. 로봇을 완전히 세워둔
    # 채로 잰 결과(5840 표본):
    #     자이로 z 평균      = -0.000444 rad/s = -0.0255 deg/s   (편향)
    #     자이로 z 표준편차  =  0.001773 rad/s                    (잡음, 평균 냄)
    # 잡음이 아니라 편향이라 적분하면 그대로 쌓입니다. 휠은 정지 시 정확히
    # 0 을 내는데도 17% 밖에 반영되지 않아, EKF 가 편향의 83% 를 그대로
    # 적분했습니다. 66초에 걸쳐 실측한 odom->base_footprint 드리프트:
    #     +0.0240 deg/s = +86.3 deg/시간
    # 예측값 0.833 * 0.0255 = 0.0212 deg/s 와 일치합니다.
    #
    # 실제 피해는 SLAM 쪽에서 납니다. slam_toolbox.yaml 의
    # minimum_travel_heading 이 0.2 rad(11.5도)라, 로봇이 가만히 서 있어도
    # 8분마다 이 문턱을 넘습니다. slam_toolbox 는 "로봇이 11.5도 돌았다"고
    # 믿고 스캔을 새로 넣지만 실제 스캔은 돌지 않았으므로 벽이 어긋나
    # 겹쳐 그려집니다. 2026-08-14 매핑 시도에서 이 증상이 나왔습니다.
    #
    # 1차로 1.0 을 넣었더니 드리프트가 86.3 -> 12.8 deg/시간이 됐습니다.
    # 그런데 이걸로도 부족했습니다. 같은 날 오후 18분 매핑 후 스캔이 지도에서
    # 어긋나기에 재보니:
    #     가장 잘 맞는 보정 = yaw +3.50 deg, x +0.00 m, y +0.00 m
    #     보정 후 중앙값 오차 10.0 -> 5.0 cm (한 칸)
    # **위치는 안 틀어지고 방위만 틀어졌습니다.** 그리고 그 크기가
    # 13.8 deg/시간 x 18분 = 4.1 deg 와 맞습니다. 잔여 편향이 그대로 쌓인
    # 것입니다. 스캔매칭이 다 못 잡아주는 이유는 §10-10 (철창) 입니다 —
    # 스캔 점의 22% 가 벽 근처에 없어서 매칭 근거가 그만큼 약합니다.
    #
    # 그래서 5.0 으로 올립니다. 예상 3 deg/시간, 18분에 0.9도.
    # (측정 도구: scripts/check_scan_map_fit.py — 눈으로 판단하지 말 것.
    #  RViz 는 무선 지연 때문에 실제보다 훨씬 나쁘게 보입니다, §10-11)
    #
    # IMU 를 아예 빼지 않고 남겨두는 이유: 바퀴가 미끄러질 때는 휠 오도메트리가
    # 틀리고 자이로가 맞습니다. 가중치는 낮아도 그 국면에서는 기여합니다.
    # yaw rate 만 쓰는 이유는 §10-2(장착 축 X/Y 모호성) 를 보세요.
    #
    # 근본 해결은 편향 자체를 빼는 것입니다. 이 드라이버 버전에는 자이로
    # 편향 캡처 서비스가 없어(파라미터 서비스 6개뿐) 보정 노드를 직접 써야
    # 하고, 편향은 온도에 따라 변하므로 기동마다 재측정이 필요합니다.
    imu_angular_cov: [5.0, 0.0, 0.0,
                      0.0, 5.0, 0.0,
                      0.0, 0.0, 5.0]
