# Nav2 — 실기용. nav2_bringup 기본값(nav2_params.yaml)에서 시작해 이 로봇/이
# 방(2.4 x 3.0 m)에 맞게 고쳤습니다. HANDOFF §10-18 의 표가 근거입니다.
#
# 시뮬 config 를 못 쓰는 이유: ① use_sim_time: True ② 시뮬 패키지가 젯슨에
# sparse-checkout 제외라 파일 자체가 없음 (§1).
#
# TF 프레임 — slam.launch.py 와 동일하게 맞췄습니다 (§10-5):
#   map -> odom            AMCL 이 냅니다 (slam_toolbox 대신)
#   odom -> base_footprint EKF 가 냅니다. base_link 가 아니라 base_footprint —
#                          아래 robot_base_frame 을 전부 이걸로 맞춰야 합니다.
#                          기본값(nav2_bringup)은 base_link 라 그대로 쓰면 TF
#                          를 못 찾아 조용히 멈춥니다.
#   /odometry/filtered     EKF(robot_localization) 의 기본 발행 토픽입니다.
#                          /wheel_odometry 가 아닙니다 — 그건 EKF 의 입력.

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    # slam_toolbox.yaml 의 max_laser_range 와 맞췄습니다 (§10-17, §10-18 표).
    # 다르면 안 됩니다 — AMCL 이 지도에는 없는 4m 밖 반사를 가능도 계산에
    # 끌어들이게 됩니다.
    laser_max_range: 4.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan
    # 초기 위치를 여기서 주지 않습니다 — §10-18 3단계 절차대로 RViz 의
    # "2D Pose Estimate" 로 매번 사람이 직접 찍습니다. §9: AMCL 의 초기 위치
    # 없는 전역 재추정은 미검증이고, 빈 직사각형 방은 특히 불리합니다.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 기본 0.25 -> 0.10. 방이 3 m 라 0.25 m 오차는 방의 8% 입니다 (§10-18 표).
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 첫 실주행은 더 낮게 — 선속도 0.05, 각속도 0.2 (2026-08-19 사용자 지정).
      max_vel_x: 0.05
      max_vel_y: 0.0
      max_vel_theta: 0.2
      min_speed_xy: 0.0
      max_speed_xy: 0.05
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      # 기본 3x3 m -> 2x2 m. 방(3.25 x 2.70 m 내부)보다 크면 무의미합니다
      # (§10-18 표, 1.5~2.0 범위). 1.5 를 넣었더니 이 Nav2 빌드(1.1.20)는
      # width/height 를 정수로 선언해 두어 실기에서 즉시
      # InvalidParameterTypeException 으로 controller_server 가 죽었습니다
      # (2026-08-19 실측). nav2_bringup 기본값도 3.0 이 아니라 3 인 이유가
      # 이것 — 정수만 됩니다. 표 범위의 정수 상한인 2 를 씁니다.
      width: 2
      height: 2
      resolution: 0.05
      # robot_radius 는 안 씁니다 — 앞뒤가 비대칭(base_link 기준 x
      # -0.318 ~ +0.167)이라 원형 근사가 실제보다 훨씬 크게 잡습니다.
      # 대신 footprint 를 실측 그대로 씁니다 (URDF, 2026-08-14 실측).
      footprint: "[[0.167,0.215],[0.167,-0.215],[-0.318,-0.215],[-0.318,0.215]]"
      # 기본 voxel_layer(3D) -> obstacle_layer(2D). /scan 은 VLP-16 한
      # 링짜리 2D LaserScan 인데(§10-9), voxel_layer 는 3D 격자를 만들며
      # z_voxels(16) x z_resolution(0.05) = 0.8 m 높이까지만 잡습니다.
      # 라이다 실측 장착 높이가 1.048 m 라 센서 원점 자체가 이 격자 천장보다
      # 높아서 "Sensor origin ... out of map bounds" 로 raytrace 가 통째로
      # 안 됐습니다 (2026-08-19 실기 실측 — 젯슨에서 재현). global_costmap
      # 이 이미 쓰는 obstacle_layer(2D) 로 맞추면 이 문제 자체가 없습니다.
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 기본 0.55 -> 0.22. 방 양쪽 벽에서 1.1 m 씩(0.55*2) 고비용이 되면
        # 2.4 m 짧은 변에서 planner 가 경로를 못 찾습니다 (§10-18 표).
        # 0.20~0.25 범위의 중간값. 철창 틈(2~3 cm, §10-10)보다는 훨씬 커서
        # 그 대책도 겸합니다.
        inflation_radius: 0.22
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # 기본 3.0/2.5 -> 방 대각선(3.84 m)보다 조금 짧게. 철창 틈으로
          # 빠진 빔이 실시간에도 "여기 비어 있다"고 라이트레이싱하며 우리가
          # 방금 지도에 그려 넣은 벽을 스스로 지울 수 있습니다 (§10-10 의
          # "로컬 코스트맵이 철창을 스스로 지웁니다" — 정적 지도판은 0단계로
          # 막았지만 실시간 코스트맵판은 이 파라미터가 유일한 방어선입니다).
          # §10-17 이 정적 지도에 쓴 것과 같은 논리를 실시간 계층에도 그대로
          # 적용한 것— 미검증, 실주행에서 벽이 지워지면 더 줄이세요.
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      footprint: "[[0.167,0.215],[0.167,-0.215],[-0.318,-0.215],[-0.318,0.215]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.5   # local_costmap 과 같은 이유 (위 주석)
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.22
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # 0단계에서 닫은 지도. 원본(철창 누수 있는) tetra_lab_main 이 아니라
    # 반드시 이 파일이어야 합니다 — §10-17.
    yaml_filename: "/home/han/maps/tetra_lab_closed.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # 기본 true -> false. 미지(205)를 갈 수 있는 곳으로 보지 않겠다는
      # 0단계와 같은 원칙입니다 — "자유 공간은 주행으로만 만들 수 있다."
      # 이 방은 이미 대부분 자유로 채워져 있어 실질적 제약은 크지 않고,
      # 대신 못 가본 구석으로 계획이 새는 경우를 원천 차단합니다.
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    # FollowPath 의 max_vel_theta(0.2) 와 맞췄습니다. 기본 1.0/0.4 를 그대로
    # 두면 min > max 가 되어 Spin 복구 동작(§10-18 3단계에서 쓸 수 있는
    # recovery)이 아예 실패합니다.
    max_rotational_vel: 0.2
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.05, 0.0, 0.2]
    min_velocity: [-0.05, 0.0, -0.2]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
