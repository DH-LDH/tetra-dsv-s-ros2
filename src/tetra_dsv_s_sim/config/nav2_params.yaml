# Nav2 parameters for the TETRA-DSV-S in a 3.00 x 2.40 m room.
# Derived from scout_warehouse_sim/config/nav2_params.yaml; every value that
# differs does so because of robot geometry or room scale. The reasoning lives
# in HANDOFF.md section 5 and in the notes at each value below; git history only
# starts at 2026-08-12, after most of this was already tuned.
#
# ======================================================================
#  조정 파라미터 색인
#
#  ROS 2 파라미터 YAML 은 <노드>/ros__parameters/<키> 구조가 고정이라 값을
#  파일 상단으로 물리적으로 옮길 수 없습니다. 옮기면 로딩이 깨집니다.
#  그래서 대신 어디를 만져야 하는지 여기 모아둡니다. 각 위치에 왜 그 값인지
#  주석이 붙어 있으니 바꾸기 전에 그걸 먼저 읽으세요.
#
#  자주 만지는 것
#    controller_server/FollowPath/desired_linear_vel      0.22   주행 속도
#    controller_server/FollowPath/lookahead_dist          0.28   클수록 코너를 크게 잘라먹음
#    controller_server/general_goal_checker/xy_goal_tolerance   0.12  도착 판정 반경
#    local_costmap + global_costmap/inflation_layer/inflation_radius  0.39
#                                                       ** 반드시 양쪽 같이 **
#
#  로봇을 바꾸거나 실측이 바뀌었을 때만
#    local_costmap + global_costmap/footprint            차체 꼭짓점 4개
#                                                       ** 반드시 양쪽 같이 **
#    local_costmap/voxel_layer/z_resolution              0.10  x16 = 1.60 m 기억 높이
#                                                       센서 높이보다 커야 함(주석 참고)
#    amcl/alpha1..5                                      오도메트리 잡음 모델
#
#  건드리기 전에 §5 를 읽어야 하는 것
#    planner_server/GridBased/plugin                     NavFn <-> Smac (HANDOFF §8-A)
#    controller_server/FollowPath/plugin                 RPP <-> DWB (DWB 는 이 방에서 실패)
# ======================================================================
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
