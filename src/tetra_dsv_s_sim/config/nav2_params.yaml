bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Room-scale. The warehouse defaults demand 0.5 m of progress every 10 s,
      # which is a sixth of this room's length - any careful squeeze past the
      # pillar trips it and the goal aborts even though the robot is tracking
      # the path correctly.
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.25 m is 10% of this room's width; too coarse to call "arrived".
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.25
    # Regulated Pure Pursuit.
    #
    # Replaces DWB because DWB stalls in this room. DWB scores 20 x 40 sampled
    # trajectories and picks a winner; in a 0.62 m lane with a 0.43 m robot,
    # almost every sample collides on footprint check, so the only survivors are
    # near-zero-velocity ones - which is exactly the "Failed to make progress"
    # abort we measured.
    #
    # RPP does not sample. It takes the global path, picks a carrot at
    # lookahead_dist, and drives the arc that reaches it. Nothing can veto it
    # into standing still. The cost is that it will NOT steer around anything
    # off the path: if something blocks it, it stops and waits for the global
    # planner to replan. Fine for a static room; revisit if people walk through.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      # Pure pursuit cuts corners in proportion to lookahead_dist, and the
      # inside of the cut is where the pillar is. 0.28 m trades a little
      # smoothness for a tighter hug of the planned path.
      lookahead_dist: 0.28
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false

      # Approach: ease down near the goal instead of overshooting a 0.12 m
      # tolerance at full speed.
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.40

      # The two "regulated" behaviours.
      use_regulated_linear_velocity_scaling: true      # slow into tight curves
      use_cost_regulated_linear_velocity_scaling: true # slow near obstacles
      regulated_linear_scaling_min_radius: 0.40
      regulated_linear_scaling_min_speed: 0.08
      # Must match the inflation layer's cost_scaling_factor or the cost-based
      # slowdown is computed against the wrong curve.
      inflation_cost_scaling_factor: 5.0
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0

      # Turn on the spot to face the path before driving. Verified achievable:
      # the robot does clean point turns at ~0.5 rad/s.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.50
      rotate_to_heading_angular_vel: 0.80
      max_angular_accel: 3.2
      # Mutually exclusive with use_rotate_to_heading; RPP refuses to load if
      # both are true.
      allow_reversing: false

      use_collision_detection: true
      # At 0.22 m/s, 1.0 s only checks 0.22 m ahead - shorter than the robot.
      # 1.8 s covers the body length so RPP halts rather than grazing.
      max_allowed_time_to_collision_up_to_carrot: 1.8
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      max_robot_pose_search_dist: 5.0
      transform_tolerance: 0.2

    # ---- Previous DWB configuration, kept for comparison ----
    ## DWB parameters
    #FollowPath:
    #  plugin: "dwb_core::DWBLocalPlanner"
    #  debug_trajectory_details: True
    #  min_vel_x: 0.0
    #  min_vel_y: 0.0
    #  max_vel_x: 0.22
    #  max_vel_y: 0.0
    #  max_vel_theta: 1.0
    #  min_speed_xy: 0.0
    #  max_speed_xy: 0.22
    #  min_speed_theta: 0.0
    #  # Add high threshold velocity for turtlebot 3 issue.
    #  # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
    #  acc_lim_x: 2.5
    #  acc_lim_y: 0.0
    #  acc_lim_theta: 3.2
    #  decel_lim_x: -2.5
    #  decel_lim_y: 0.0
    #  decel_lim_theta: -3.2
    #  vx_samples: 20
    #  vy_samples: 5
    #  vtheta_samples: 40   # finer rotation choice for tight manoeuvres
    #  # Shorter horizon: at 0.22 m/s, 1.7 s looks 0.37 m ahead, which in a
    #  # 0.62 m lane rejects nearly every sampled trajectory.
    #  sim_time: 1.2
    #  linear_granularity: 0.05
    #  angular_granularity: 0.025
    #  transform_tolerance: 0.2
    #  xy_goal_tolerance: 0.25
    #  trans_stopped_velocity: 0.25
    #  short_circuit_trajectory_evaluation: True
    #  stateful: True
    #  critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    #  BaseObstacle.scale: 0.02
    #  PathAlign.scale: 32.0
    #  PathAlign.forward_point_distance: 0.1
    #  GoalAlign.scale: 24.0
    #  GoalAlign.forward_point_distance: 0.1
    #  PathDist.scale: 32.0
    #  GoalDist.scale: 24.0
    #  RotateToGoal.scale: 32.0
    #  RotateToGoal.slowing_factor: 5.0
    #  RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.02
      footprint: "[[0.1675, 0.215], [0.1675, -0.215], [-0.318, -0.215], [-0.318, 0.215]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # NavFn plans for a POINT on this inflated grid - it never checks the
        # footprint. So the inflation radius is the only thing keeping the body
        # off obstacles, and it has to cover the body's actual reach.
        #
        # This footprint is badly asymmetric because base_link sits on the drive
        # axle: inscribed 0.1675 m to the front, circumscribed 0.3839 m to the
        # rear corners - a factor of 2.29. At 0.20 m the zero-cost boundary sat
        # 0.35 m from the pillar centre while straight-line passage alone needs
        # 0.365 m, and a turning corner needs far more. Measured result was a
        # -0.0002 m graze of the pillar.
        #
        # 0.28 m puts the boundary 0.43 m out, clearing the 0.365 m straight
        # requirement by 65 mm and leaving a 0.49 m lane against the long walls.
        inflation_radius: 0.39
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        # The voxel column must CONTAIN the sensor, or clearing dies silently.
        #
        # Nav2 clears a cell by raytracing from the sensor origin to each return;
        # if that origin falls outside the grid, raytraceFreespace bails and the
        # layer marks obstacles it can never erase again. At the inherited
        # 0.05 x 16 = 0.80 m the VLP-16 sat 25 cm above the ceiling of its own
        # grid, so every run logged, at 5 Hz:
        #   "Sensor origin at (.., .., 1.05) is out of map bounds ... to 0.78.
        #    The costmap cannot raytrace for it."
        # A static room hides this - there is nothing to erase - which is why it
        # survived every test until 2026-08-12.
        #
        # z_voxels CANNOT go above 16: a column is one uint32_t split into two
        # 16-bit halves (marked / unknown). See nav2_voxel_grid/voxel_grid.hpp,
        # "only sizes <= 16 are supported". So raise the cell height instead.
        #
        # 0.10 x 16 = 1.60 m, which is deliberately the same as max_height in
        # pointcloud_to_laserscan.yaml: the local costmap then covers the same
        # vertical band as the /scan everything else in the stack consumes.
        # Cost is nothing - same cell count - and 10 cm of vertical resolution is
        # irrelevant to a planar robot whose 3D grid is projected to 2D costs.
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /points
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.45
          obstacle_max_range: 5.5
          obstacle_min_range: 0.40
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[0.1675, 0.215], [0.1675, -0.215], [-0.318, -0.215], [-0.318, 0.215]]"
      resolution: 0.02
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.39
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 1.0]
    min_velocity: [-0.22, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
